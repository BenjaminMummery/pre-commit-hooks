########## PROJECT SETUP ###############################################################

[project]
name = "pre-commit-hooks"
version = "3.0.0"
authors=[
    {name = "Benjamin Mummery", email="benjamin.mummery13@gmail.com"}
]
description = "A selection of quality-of-life tools for use with pre-commit."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "gitpython>=3.1.46",
    "identify>=2.6.1",
    "tomli>=2.4.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "docs"},
    {include-group = "test"},
    "python-semantic-release>=10.5.3",
]
lint = [
    "deptry>=0.23.1",
    "pre-commit>=3.5.0",
    "ruff>=0.15.0",
]
docs = [
    "mkdocs-material>=9,<10",
    "mkdocstrings[python]>=0.30",
]
test = [
    "freezegun>=1.5.5",
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pytest-git>=1.8.0",
    "pytest-mock>=3.14.1",
]

[project.scripts]
add-copyright = "src.add_copyright_hook.add_copyright:main"
add-msg-issue = "src.add_msg_issue_hook.add_msg_issue:main"
sort-file-contents = "src.sort_file_contents_hook.sort_file_contents:main"
update-copyright = "src.update_copyright_hook.update_copyright:main"
no-import-testtools-in-src = "src.no_import_testtools_in_src_hook.no_import_testtools_in_src:main"
americanise = "src.americanise_hook.americanise:main"
sync-type-hints = "src.sync_type_hints_hook.sync_type_hints:main"

########## BUILD SYSTEM CONFIGURATION ##################################################

[build-system]
requires = ["uv_build>=0.11.20,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
namespace = true

[tool.distutils.bdist_wheel]
universal = true

[tool.add_copyright]
name = "Benjamin Mummery"

########## TESTING TOOL CONFIGURATION ##################################################

[tool.pytest]
addopts = [
    "--doctest-modules",
    "--strict-markers",
    "--cov=src",
    "--cov-fail-under=78",
]

########## LINTING AND FORMATTING TOOL CONFIGURATION ###################################

[tool.mypy]
files = ["src"]
exclude = "(?x)(^tests/|.*/test_.*\\.py$)"
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.ruff]
target-version = "py39"
line-length = 88
indent-width = 4
show-fixes = true
extend-exclude = ["tests/examples"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "EM",   # flake8-errmsg
    "ERA",  # eradicate
    "F",    # pyflakes
    "FA",   # flake8-future-annotations
    "FBT",  # flake8-boolean-trap
    "FLY",  # flynt
    "G010", # logging.warn
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "INP",  # flake8-no-pep420
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # perflint
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff-specific rules
    "S307", # eval
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "TCH",  # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "YTT",  # flake8-2020
]
ignore = [
    "ANN401",  # allow Any in annotations for hook CLI/config boundaries
    "D105",    # magic methods
    "D107",    # __init__ methods
    "FBT001",  # boolean positional args in argparse-heavy hook CLIs
    "FBT002",  # boolean default args in argparse-heavy hook CLIs
    "PLR0913", # hooks often need many parameters
    "PLR2004", # magic values in tests
    "TRY003",  # long exception messages are fine in hooks
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
lines-between-types = 1

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"conftest.py" = [
    "ANN",
    "D",
    "PTH109",
    "PT003",
    "RUF012",
    "TID251",
]
"**/test_*.py" = [
    "A",
    "ANN",
    "ARG",
    "D",
    "E501",
    "INP001",
    "N802",
    "N803",
    "PTH109",
    "SIM117",
    "SLF001",
    "PLR2004",
    "PT",
    "PTH123",
    "PLW1510",
    "T20",
    "TID251",
]
"tests/examples/*.py" = ["ALL"]
"src/sync_type_hints_hook/docstring_types.py" = ["PLR0912"]
"src/americanise_hook/americanise.py" = ["PLW0133"]
"src/**/*_hook/**/*.py" = ["T20"]
"src/sync_type_hints_hook/sync_type_hints.py" = ["PLR0912", "T20"]
"src/_shared/config_parsing.py" = ["PLC0415"]  # tomllib import guarded by version

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest" = { msg = "Test frameworks must only be imported from test modules." }
"pytest_mock" = { msg = "Test frameworks must only be imported from test modules." }
"unittest" = { msg = "Test frameworks must only be imported from test modules." }

[tool.deptry]
known_first_party = ["src"]
extend_exclude = ["conftest.py", "src/.*/test_.*\\.py"]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

########## RELEASE TOOLS ###############################################################

[tool.semantic_release]
assets = []
commit_message = "build: {version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "angular"
logging_use_named_masks = false
major_on_zero = true
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/__init__.py:__version__"]
build_command = """
pip install 'uv>=0.10.4'
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
uv build
"""

[tool.semantic_release.branches.main]
match = "(main|master|release)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = []

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = true

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
