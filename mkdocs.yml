site_name: pre-commit-hooks
site_description: Quality-of-life hooks for pre-commit
site_url: https://benjaminmummery.github.io/pre-commit-hooks/
repo_url: https://github.com/BenjaminMummery/pre-commit-hooks
repo_name: BenjaminMummery/pre-commit-hooks
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2022–2026 Benjamin Mummery
strict: true

theme:
  name: material
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            filters: []
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Hooks:
      - Copyright: hooks/copyright.md
      - Commit messages: hooks/commit-messages.md
      - File maintenance: hooks/file-maintenance.md
      - Type hints: hooks/type-hints.md
  - API reference:
      - Overview: reference/index.md
      - Shared utilities: reference/shared.md
      - Copyright hooks: reference/copyright.md
      - Commit messages: reference/commit-messages.md
      - File maintenance: reference/file-maintenance.md
      - Type hints: reference/type-hints.md
  - Contributing: contributing.md
  - Changelog: changelog.md
