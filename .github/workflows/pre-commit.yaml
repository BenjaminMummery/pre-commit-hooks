---
name: pre-commit
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      SKIP: no-commit-to-branch
    steps:
      - uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.4
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - uses: pre-commit/action@v3.0.1
