---
default_language_version:
  python: python3

default_install_hook_types: [pre-commit, pre-push, prepare-commit-msg, commit-msg]
default_stages: [pre-commit]

repos:
  # Fast, read-only checks first (fail before any file modifications).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [-b, main, -b, master, -b, dev, -b, develop]
        stages: [pre-commit]
      - id: detect-private-key
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-ast
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: destroyed-symlinks
      - id: forbid-submodules
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: tests/examples/.*|conftest\.py

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  # Content normalisers (before spell-check and Python lint/format).
  - repo: local
    hooks:
      - id: add-copyright
        name: Add copyright string to source files
        entry: uv run --no-sync add-copyright
        language: system
        exclude: CHANGELOG.md
        types_or:
          - c++
          - c#
          - css
          - dart
          - html
          - java
          - javascript
          - kotlin
          - lua
          - markdown
          - perl
          - php
          - python
          - ruby
          - rust
          - scala
          - sql
          - swift
      - id: update-copyright
        name: Update dates on copyright strings in source files
        entry: uv run --no-sync update-copyright
        language: system
        stages: [pre-push, manual]
        types_or:
          - c++
          - c#
          - css
          - dart
          - html
          - java
          - javascript
          - kotlin
          - lua
          - markdown
          - perl
          - php
          - python
          - ruby
          - rust
          - scala
          - sql
          - swift
      - id: add-msg-issue
        name: Add issue to the commit message
        entry: uv run --no-sync add-msg-issue
        language: system
        always_run: true
        stages: [prepare-commit-msg]
      - id: sort-file-contents
        name: Sort gitignore sections
        entry: uv run --no-sync sort-file-contents
        language: system
        files: ^\.gitignore$
      - id: sync-type-hints
        name: Sync type hints with docstrings
        entry: uv run --no-sync sync-type-hints
        language: system
        files: ^src/
        exclude: src/.*/test_.*\.py$
        args: [--on-clash=prefer-signature]
      - id: deptry
        name: Check Python dependency declarations
        entry: uv run --no-sync deptry .
        language: system
        always_run: true
        pass_filenames: false

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [-w]

  # Python lint/format (ruff replaces isort, pycln, pydocstyle, interrogate, pyupgrade).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Whitespace and line-ending cleanup after formatters.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
